async function authUser(username, password) {
  const email = username + AUTH_DOMAIN;
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    return cred.user;
  } catch (e) {
    if (
      e.code === 'auth/user-not-found' ||
      e.code === 'auth/invalid-login-credentials' ||
      e.code === 'auth/invalid-credential'
    ) {
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        return cred.user;
      } catch (e2) {
        if (e2.code === 'auth/email-already-in-use') {
          const err = new Error('Wrong password');
          err.code = 'auth/wrong-password';
          throw err;
        }
        throw e2;
      }
    }
    throw e;
  }
}

async function bindUid(username, uid) {

async function send() {
  const inp = $('inp');
  const x = inp.innerText.trim();
  if (!x || !me || banEl) return;
  const clr = () => { inp.innerText = ''; fit(); };
  if (x[0] === '/' && await cmd(x)) { clr(); return; }
  if (editing) {
    const id = editing.id, old = editing.text;
    cancelReply();
    if (x !== old) await db.ref(pathFor(chat) + id).update({ text: x, edited: true });
    clr();
    return;
  }
  if (chat !== 'global' && !isG(chat)) {
    if (blocked.has(chat)) return toast(t('unblockFirst'));
    if ((await db.ref('blocks/' + chat + '/' + me.u).once('value')).val()) return toast(t('restricted'));
  }
  if (isG(chat) && !canPost(chat)) return toast(t('onlyAdminsCanPost'));
  if (chat === 'global' && containsMat(x)) {
    if (Date.now() < mutedUntil) return toast(t('matMuted').replace('{n}', mutedText()));
    const role = badges[me.u] || (me.u === 'admin11' ? 'admin' : null);
    let muteSec = 5 * 60;
    if (role === 'admin') muteSec = 0;
    else if (role === 'checked') muteSec = 60;
    mutedUntil = Date.now() + muteSec * 1000;
    if (muteSec > 0) toast(t('matWarning').replace('{n}', mutedText()));
    clr();
    return;
  }
  let bp = null;
  if (x.startsWith('.Buttons')) {
    if (chat === 'global' && !badges[me.u] && me.u !== 'admin11') return toast(t('verifiedOnly'));
    bp = parseBtn(x);
    if (!bp) return toast(t('btnFmt'));
  }
  const m = { username: me.u, displayName: me.n, text: bp ? bp.msg : x, time: Date.now() };
  if (bp) { m.isButton = true; m.buttonText = bp.btn; m.buttonLink = bp.link; }
  if (reply) { m.replyTo = reply.id; m.replyToSender = reply.name; }
  if (autoDel > 0 && chat !== 'global') m.expireAt = m.time + autoDel * 1000;
  clr();
  cancelReply();
  mineNew = true;
  if (chat === 'global') {
    await db.ref('messages').push(m);
    trim();
  } else {
    await db.ref(pathFor(chat)).push(m);
    const p = chat;
    if (p !== me.u) {
      locl.delete(p);
      db.ref('userChats/' + me.u + '/' + p).set(true);
      db.ref('userChats/' + p + '/' + me.u).set(true);
    }
    db.ref('typing/' + room(p) + '/' + me.u).remove();
  }
}

function lastSeenText(ts) {
  if (!ts) return t('lastSeen');
  const n = Date.now(), d = n - ts;
  if (d < 60000) return t('online');
  const s = x => { const q = new Date(x); return new Date(q.getFullYear(), q.getMonth(), q.getDate()).getTime(); };
  const df = Math.round((s(n) - s(ts)) / 864e5);
  if (df === 0) return t('seenToday') + ' ' + hm(ts);
  if (df === 1) return t('seenYest') + ' ' + hm(ts);
  if (d < 2592000000) return t('seenOn') + ' ' + new Date(ts).toLocaleDateString(loc(), { day: 'numeric', month: 'long' }) + ' ' + t('seenAt') + ' ' + hm(ts);
  return t('seenLong');
}
const MONTHS_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function bdayText(b) {
  if (!b || !b.d || !b.m) return '';
  const mo = (lang() === 'ru' ? MONTHS_RU : MONTHS_EN)[b.m - 1];
  let s = b.d + ' ' + mo;
  if (b.y) {
    const n = new Date();
    let a = n.getFullYear() - b.y;
    if (n.getMonth() + 1 < b.m || (n.getMonth() + 1 === b.m && n.getDate() < b.d)) a--;
    s += ' ' + b.y + ' (' + a + ')';
  }
  return s;
}

  if (isG(u)) return groupInfo(gid_(u));
  const self = u === me.u;
  const x = (await db.ref('users/' + u).once('value')).val() || {};
  const [fs, fg] = await Promise.all([db.ref('followers/' + u).once('value'), db.ref('following/' + u).once('value')]);

const KC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@%&*+=-_~^';
const rk = () => { const a = new Uint32Array(5); crypto.getRandomValues(a); return [...a].map(x => KC[x % KC.length]).join(''); };
const kh = k => sha('k:' + k);
async function freshKey() { for (let i = 0; i < 40; i++) { const k = rk(); if (!(await db.ref('keys/' + await kh(k)).once('value')).exists()) return k; } return null; }

async function keyDialog(done) {

  o.querySelector('#ka').onclick = async e => {

    try {

      if (!r.committed) { const n = await freshKey(); if (n) { k = n; kv.textContent = k; } toast(t('keyTaken')); b.disabled = false; return; }
      const old = (await db.ref('users/' + me.u + '/keyHash').once('value')).val();

      if (storedPass) localStorage.setItem('mg_key_' + k, JSON.stringify({ u: me.u, p: storedPass }));

    } catch (e) { console.error(e); toast(t('failed')); b.disabled = false; }
  };
}

async function renameUser(o, n) {
  const R = db.ref();
  const get = async p => (await R.child(p).once('value')).val();
  if ((await R.child('users/' + n).once('value')).exists()) return 'taken';
  const u0 = await get('users/' + o);
  const up = {};
  up['users/' + n] = { ...u0, username: n };
  up['users/' + o] = null;
  up['onlineUsers/' + o] = null;
  if (u0.keyHash) up['keys/' + u0.keyHash + '/u'] = n;
  const bg = await get('userBadges/' + o);
  if (bg) { up['userBadges/' + n] = bg; up['userBadges/' + o] = null; }
  const fl = await get('followers/' + o) || {};
  const fg = await get('following/' + o) || {};
  if (Object.keys(fl).length) { up['followers/' + n] = fl; up['followers/' + o] = null; for (const f in fl) { up['following/' + f + '/' + o] = null; up['following/' + f + '/' + n] = true; } }
  if (Object.keys(fg).length) { up['following/' + n] = fg; up['following/' + o] = null; for (const g in fg) { up['followers/' + g + '/' + o] = null; up['followers/' + g + '/' + n] = true; } }
  const bk = await get('blocks') || {};
  for (const b in bk) {
    if (b === o) { up['blocks/' + n] = bk[b]; up['blocks/' + o] = null; }
    else if (bk[b] && bk[b][o]) { up['blocks/' + b + '/' + o] = null; up['blocks/' + b + '/' + n] = true; }
  }
  const ch = await get('userChats/' + o) || {};
  up['userChats/' + n] = ch;
  up['userChats/' + o] = null;
  for (const q in ch) {
    up['userChats/' + q + '/' + o] = null;
    up['userChats/' + q + '/' + n] = true;
    const ro = 'private_' + [o, q].sort().join('_');
    const rn = 'private_' + [n, q].sort().join('_');
    const ms = await get('privateMessages/' + ro);
    if (ms) { for (const id in ms) if (ms[id].username === o) ms[id].username = n; up['privateMessages/' + rn] = ms; up['privateMessages/' + ro] = null; }
    const pn = await get('privatePins/' + ro);
    if (pn) { if (pn.by === o) pn.by = n; up['privatePins/' + rn] = pn; up['privatePins/' + ro] = null; }
  }
  const gm = await get('messages') || {};
  for (const id in gm) if (gm[id].username === o) up['messages/' + id + '/username'] = n;
  await R.update(up);
  ['lr', 'cl', 'ad', 'scan'].forEach(k => { const v = localStorage.getItem('mg_' + k + '_' + o); if (v !== null) localStorage.setItem('mg_' + k + '_' + n, v); });
  return 'ok';
}

let ddOpen = null;
function closeDD() { if (!ddOpen) return; const { d, l } = ddOpen; l.classList.add('hide'); l.style.cssText = ''; d.appendChild(l); ddOpen = null; }
function placeDD() {
  if (!ddOpen) return;
  const { b, l } = ddOpen;
  const r = b.getBoundingClientRect();
  const c = b.closest('.sb');
  if (c) { const cr = c.getBoundingClientRect(); if (r.bottom < cr.top || r.top > cr.bottom) return closeDD(); }
  const below = innerHeight - r.bottom - 12;
  const up = below < 160 && r.top > below;
  l.style.left = r.left + 'px';
  l.style.width = r.width + 'px';
  l.style.maxHeight = Math.min(240, (up ? r.top : below) - 6) + 'px';
  if (up) { l.style.top = ''; l.style.bottom = innerHeight - r.top + 6 + 'px'; }
  else { l.style.bottom = ''; l.style.top = r.bottom + 6 + 'px'; }
}
document.addEventListener('scroll', e => { if (ddOpen && !ddOpen.l.contains(e.target)) placeDD(); }, true);
addEventListener('resize', placeDD);
document.addEventListener('click', e => {
  const it = e.target.closest('.ddl div');
  if (it && ddOpen && ddOpen.l.contains(it)) {
    const d = ddOpen.d;
    d.dataset.v = it.dataset.v;
    d.querySelector('.ddb span').innerHTML = E(it.textContent);
    ddOpen.l.querySelectorAll('div').forEach(x => x.classList.toggle('on', x === it));
    closeDD();
    d.dispatchEvent(new Event('change', { bubbles: true }));
    return;
  }
  const b = e.target.closest('.ddb');
  const d = b && b.parentElement;
  const was = ddOpen && ddOpen.d === d;
  closeDD();
  if (!d || was) return;
  const l = d.querySelector('.ddl');
  document.body.appendChild(l);
  l.classList.remove('hide');
  ddOpen = { d, l, b };
  placeDD();
});

function watchG(p) {
  const g = gid_(p);
  if (grpKnown.has(g)) return;
  grpKnown.add(g);
  on(db.ref('groups/' + g), s => {
    const v = s.val();
    if (!v) {
      if (GR[g]) {
        delete GR[g];
        idx.delete(p);
        db.ref('userChats/' + me.u + '/' + p).remove();
        if (chat === p) open(globalDisabled ? me.u : 'global');
      }
      side();
      return;
    }
    GR[g] = v;
    names.set(p, v.title);
    if (v.avatar && IMG.test(v.avatar)) AV[p] = v.avatar; else delete AV[p];
    side(); hdr(); comp();
  });
  on(db.ref('members/' + g), s => {
    const had = MB[g] && MB[g][me.u];
    MB[g] = s.val() || {};
    if (had && !MB[g][me.u]) {

function pickImage(size, cb, quality, square) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px';
  document.body.appendChild(input);
  const done = () => setTimeout(() => input.remove(), 0);
  input.onchange = async e => {
    const file = e.target.files && e.target.files[0];
    done();
    if (!file) return;
    try {
      let src, w, h;
      if (window.createImageBitmap) {
        src = await createImageBitmap(file, { imageOrientation: 'from-image' });
        w = src.width; h = src.height;
      } else {
        src = await new Promise((ok, no) => {
          const im = new Image(), u = URL.createObjectURL(file);
          im.onload = () => { URL.revokeObjectURL(u); ok(im); };
          im.onerror = no;
          im.src = u;
        });
        w = src.naturalWidth; h = src.naturalHeight;
      }
      let sx = 0, sy = 0, sw = w, sh = h;
      if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; }
      const k = Math.min(size / sw, size / sh, 1);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw * k));
      c.height = Math.max(1, Math.round(sh * k));
      const x = c.getContext('2d');
      x.fillStyle = '#fff';
      x.fillRect(0, 0, c.width, c.height);
      x.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
      if (src.close) src.close();
      cb(c.toDataURL('image/jpeg', quality || 0.85));
    } catch (err) { console.error(err); toast(t('failed')); }
  };
  input.addEventListener('cancel', done);
  input.click();
}

function fmt(s) {
  const keep = [];
  const hold = h => '\u0000' + (keep.push(h) - 1) + '\u0000';
  let x = esc(s);
  x = x.replace(/`([^`\n]+)`/g, (_, c) => hold('<code>' + c + '</code>'));
  x = x.replace(/https?:\/\/[\x21-\x7E]+/g, u => {
    const m = u.match(/[.,;:!?)\]]+$/), tail = m ? m[0] : '', l = u.slice(0, u.length - tail.length);
    return hold('<span class="lk" data-link="' + l + '">' + l + '</span>') + tail;
  });
  x = x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<i>$1</i>').replace(/~~(.+?)~~/g, '<s>$1</s>');
  return emo(x.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[i]));
}
