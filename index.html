<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RedFox</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
:root{--bg:#000;--p:#161616;--l:#262626;--t:#ececec;--m:#8a8a8a;--mine:#3a3a3a;--oth:#1d1d1d;--d:#e5534b;--btn:#e6e6e6;--btnt:#111;--g:#2a2a2a;--hv:#ffffff14;--fld:#0d0d0d;--fb:#555;--side:#0b0b0b;--h1:#ffffff0d;--h2:#ffffff17;--av:#3a3a3a;--avt:#fff;--day:#1c1c1c;--sn:#bbb;--rp:#aaa;--rpl:#888;--rpb:#ddd;--fl:#5a5a5a;--ctx:#202020;--ovl:#000000b0;--r:18px;--rt:4px;--check-on:#5a5a5a;--gl:rgba(20,20,20,.55);--gl2:rgba(20,20,20,.85);--gb:rgba(255,255,255,.08);--soft:rgba(255,255,255,.04);--hv2:rgba(255,255,255,.08);--hv3:rgba(255,255,255,.12);--blur:22px;--sideblur:22px}
:root[data-theme=light]{--bg:#f1f2f4;--p:#fff;--l:#e3e5e8;--t:#1a1c1f;--m:#7b8088;--mine:#23272d;--oth:#fff;--d:#d9453d;--btn:#1c1e22;--btnt:#fff;--g:#eceef1;--hv:#0000000d;--fld:#f6f7f8;--fb:#9aa0a8;--side:#fff;--h1:#0000000a;--h2:#00000012;--av:#e3e6ea;--avt:#4a5058;--day:#e4e6ea;--sn:#555;--rp:#777;--rpl:#999;--rpb:#333;--fl:#d5d8dd;--ctx:#fff;--ovl:#1a1c1f66;--check-on:#8b9099;--gl:rgba(255,255,255,.65);--gl2:rgba(255,255,255,.9);--gb:rgba(0,0,0,.06);--soft:rgba(0,0,0,.02);--hv2:rgba(0,0,0,.05);--hv3:rgba(0,0,0,.08)}
:root[data-blur=off]{--gl:var(--p);--gl2:var(--p)}
:root[data-anim=off] *{animation:none!important;transition:none!important}
:root[data-blur=off] *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html,body{height:100%;overflow:hidden}
body{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,textarea{font:inherit;color:inherit}
input,textarea{outline:none}
.hide{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--m);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
.ib:hover{background:var(--hv);color:var(--t)}
.ib:active{transform:scale(.92)}
.b{padding:11px 16px;border-radius:14px;border:0;background:var(--btn);color:var(--btnt);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:opacity .15s,transform .1s;flex-shrink:0}
.b:hover{opacity:.88}.b:active{transform:scale(.97)}.b:disabled{opacity:.4;cursor:default}
.b.g{background:var(--g);color:var(--t)}.b.d{background:var(--d);color:#fff}
.fld{width:100%;padding:13px 15px;background:var(--fld);border:1px solid var(--l);border-radius:14px;transition:border-color .15s}
.fld:focus{border-color:var(--fb)}
textarea.fld{resize:none;display:block;line-height:1.4}
#login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.card{width:100%;max-width:380px;background:var(--p);border:1px solid var(--l);border-radius:24px;padding:22px 30px 30px;display:flex;flex-direction:column;gap:14px;animation:up .3s ease;box-shadow:0 12px 40px #0000001a}
.card h2{font-size:24px;font-weight:600;text-align:center;margin-bottom:2px}
.card label{font-size:13px;color:var(--m);display:block;margin-bottom:6px}
.err{color:var(--d);font-size:13px;min-height:16px}
#app{height:100%;display:flex}
#side{width:300px;background:var(--side);border-right:1px solid var(--l);display:flex;flex-direction:column;padding:12px;gap:10px;flex-shrink:0;transition:transform .25s ease}
.me-row{display:flex;align-items:center;gap:10px;padding:2px}
.me-row .nm{flex:1;min-width:0;cursor:pointer}
.nm b,.it b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small,.it small{color:var(--m);font-size:12px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sec{font-size:12px;color:var(--m);padding:12px 10px 4px}
.it{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:background .15s}
.it:hover{background:var(--h1)}.it.on{background:var(--h2)}
.it>div:nth-child(2){flex:1;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--av);color:var(--avt);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;position:relative}
.av i{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#4cd964;border:2px solid var(--side)}
.av.big{width:92px;height:92px;font-size:38px;box-shadow:0 0 0 4px #ffffff40}
.cnt{background:var(--btn);color:var(--btnt);border-radius:10px;padding:1px 7px;font-size:12px;font-weight:600}
.vb{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-left:4px;cursor:pointer;transition:transform .15s}
.vb:hover{transform:scale(1.15)}
.vb svg{width:100%;height:100%;stroke:none}
#main{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#hdr,#pinbar,#rbar,.pill,.ctx,.toast,.md,.warnbar{border:1px solid var(--gb);backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%)}
#hdr,#pinbar,#rbar,.pill,.warnbar{background:var(--gl)}
.ctx,.toast,.md{background:var(--gl2)}
#hdr{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;height:50px;z-index:5;border-radius:25px;display:flex;align-items:center;padding:0 8px 0 6px;gap:6px;box-shadow:0 4px 18px #00000014}
#hdr .t{flex:1;min-width:0;padding-left:4px}
#hdr .t b{display:block;line-height:1.15}#hdr .t small{color:var(--m);font-size:12px}
#menubtn{display:none}
#pinbar{position:absolute;top:68px;left:12px;right:12px;z-index:4;border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;animation:down .2s ease}
#pinbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warnbar{position:absolute;top:68px;left:12px;right:12px;z-index:6;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;animation:down .2s ease}
.warnbar span{flex:1;line-height:1.35}
.warnbar .acts{display:flex;gap:6px;flex-shrink:0}
.warnbar .acts .b{padding:8px 12px;font-size:12px;border-radius:10px}
#msgs{flex:1;overflow-y:auto;padding:72px 12px 90px;display:flex;flex-direction:column;gap:2px}
#msgs.pp{padding-top:112px}
.day{text-align:center;margin:10px 0 6px}
.day span{background:var(--day);border-radius:12px;padding:3px 11px;font-size:12px;color:var(--m)}
.sys{text-align:center;margin:6px 0;display:flex;justify-content:center}
.sys span{background:var(--day);border-radius:12px;padding:4px 12px;font-size:12px;color:var(--m);display:inline-block;max-width:90%;text-align:center;line-height:1.35}
.empty{margin:auto;color:var(--m);font-size:14px}
.m{width:fit-content;max-width:min(78%,520px);padding:7px 12px 6px;border-radius:var(--r);line-height:1.35;cursor:pointer;word-break:break-word;white-space:pre-wrap;transition:background .4s, border-radius .2s}
.m:after{content:'';display:block;clear:both}
.m small{float:right;margin:5px 0 0 12px;font-size:11px;color:var(--m);white-space:nowrap}
.me{align-self:flex-end;background:var(--mine);color:#fff}.me.tail{border-bottom-right-radius:var(--rt)}
.ot{align-self:flex-start;background:var(--oth);box-shadow:0 1px 2px #0000000f}.ot.tail{border-bottom-left-radius:var(--rt)}.m.first{margin-top:7px}
.m.new{animation:pop .22s ease}
.m.fl{background:var(--fl)}.me.fl{background:#555}
.me small{color:#aeb3ba}.me .rp{color:#c9ccd1;border-color:#8a9099}.me .rp b{color:#fff}
.sn{font-size:12px;font-weight:600;color:var(--sn);margin-bottom:2px;cursor:pointer}.sn:hover{text-decoration:underline}
.rp{font-size:12px;color:var(--rp);border-left:2px solid var(--rpl);padding:1px 0 1px 8px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:var(--rt)}
.rp b{display:block;color:var(--rpb)}
#comp{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;gap:6px}
#rbar{border-radius:16px;padding:7px 6px 7px 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sn);animation:down .15s ease}
#rbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:flex;align-items:flex-end;gap:6px;border-radius:26px;padding:6px 6px 6px 18px;min-height:52px;box-shadow:0 4px 18px #00000014}
.pill textarea{flex:1;background:none;border:0;min-width:0;resize:none;height:38px;max-height:120px;line-height:22px;padding:8px 0;overflow-y:auto}
#send{background:var(--btn);color:var(--btnt)}#send:hover{opacity:.85}
.ctx{position:fixed;z-index:9000;min-width:190px;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .14s ease;max-height:60vh;overflow-y:auto}
.ctx div{padding:11px 16px;cursor:pointer;font-size:14px;transition:background .12s}
.ctx div:hover{background:var(--hv2)}
.ctx .dd{color:var(--d)}.ctx .tm{color:var(--m);font-size:12px;cursor:default;border-bottom:1px solid var(--gb)}
.ov{position:fixed;inset:0;background:var(--ovl);backdrop-filter:blur(calc(var(--blur)*.4));-webkit-backdrop-filter:blur(calc(var(--blur)*.4));display:flex;align-items:center;justify-content:center;z-index:9500;padding:16px;animation:fade .18s ease}
.md{border-radius:24px;padding:24px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:up .2s ease;box-shadow:0 12px 40px #0000001a}
.md>*{flex-shrink:0}
.md h3{font-size:18px;font-weight:600}.md p,.md .hint{color:var(--m);font-size:13px}
.hint{color:var(--m);font-size:13px}
.md hr{border:0;border-top:1px solid var(--gb)}
.md.pm{padding:0;gap:0}
.md.st{padding:0;gap:0;overflow:hidden;height:min(640px,88vh)}
.row{display:flex;gap:10px}.row>*{flex:1}
.bl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.bl>span{min-width:0}
.sh{font-size:12px;color:var(--m);margin:6px 0 -4px 4px}
.grp,.info,.ulist,.kbox{background:var(--soft);border:1px solid var(--gb)}
.grp{border-radius:16px;padding:2px 14px}
.grp .bl{padding:10px 0}.grp .bl+.bl{border-top:1px solid var(--gb)}
.rd{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer}
.rd+.rd{border-top:1px solid var(--gb)}
.rd small{display:block;color:var(--m);font-size:12px}
.sb .b,.grp .b{white-space:nowrap;font-size:13px;flex-shrink:0}
.ban{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:34px 20px 22px;color:#fff;text-align:center}
.ban b{font-size:20px;margin-top:8px}.ban span{font-size:13px;opacity:.8}
.ban .x{position:absolute;top:10px;right:10px;color:#fff}.ban .x:hover{background:#ffffff26;color:#fff}
.pb{padding:14px;display:flex;flex-direction:column;gap:12px}
.info{border-radius:18px;padding:4px 14px}
.ir{display:flex;align-items:center;gap:14px;padding:12px 0;min-width:0}
.ir+.ir{border-top:1px solid var(--gb)}
.ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ir div{min-width:0;word-break:break-word;white-space:pre-wrap}
.ir small{display:block;color:var(--m);font-size:12px}
.stats{display:flex;justify-content:center;gap:40px;text-align:center}.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--m)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);color:var(--t);padding:10px 18px;border-radius:12px;font-size:14px;z-index:99999;animation:toast 2.2s ease forwards;box-shadow:0 8px 32px rgba(0,0,0,.25)}
#scrim{display:none}
.bt{margin-top:8px;padding:9px 16px;border-radius:var(--rt);text-align:center;font-weight:600;cursor:pointer;transition:opacity .15s;background:var(--h2)}.bt:hover{opacity:.75}.me .bt{background:#ffffff26;color:#fff}
::placeholder{color:var(--m)}
.sth{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.sth b{flex:1;font-size:17px;font-weight:600}
.sb{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px}
.sb>*{flex-shrink:0}
.lb{display:block;font-size:12px;color:var(--m);margin:0 0 6px 4px}
.nav{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer}
.nav+.nav{border-top:1px solid var(--gb)}
.nav>span{flex:1;min-width:0}
.nav em{font-style:normal;color:var(--m);font-size:14px}
.nav>svg{width:16px;height:16px;color:var(--m)}
.dd{position:relative}
.ddb{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;color:var(--t);white-space:nowrap}
.ddb svg{width:16px;height:16px;color:var(--m);flex-shrink:0}
.ddl{position:fixed;background:var(--ctx);border:1px solid var(--gb);border-radius:14px;overflow-y:auto;z-index:99990;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .14s ease}
.ddl div{padding:11px 15px;cursor:pointer;white-space:nowrap}.ddl div:hover{background:var(--hv2)}.ddl div.on{background:var(--hv3)}
.sw{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:var(--m)}
.sw i.au{background:var(--g)}.sw i.on{outline:2px solid var(--t);outline-offset:2px}
.kbox{font:600 32px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;text-align:center;padding:18px;border-radius:16px;user-select:all;word-break:break-all}
#fN{display:flex;flex-direction:column;gap:14px}
img.em{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;margin:0 .03em;object-fit:contain;-webkit-user-drag:none}
.ulist{max-height:240px;overflow-y:auto;border-radius:16px;padding:4px 14px}
.ulist .bl{padding:10px 0}.ulist .bl+.bl{border-top:1px solid var(--gb)}
.preview-bubble{background:var(--hv3);padding:8px 12px;font-size:13px;max-width:80%;color:var(--t);border:1px solid var(--gb)}
.preview-bubble.me{background:var(--btn);color:var(--btnt);align-self:flex-end;border-color:transparent}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--hv3);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--btn);margin-top:-7px;border:0;cursor:pointer}
input[type=range]::-moz-range-track{height:6px;background:var(--hv3);border-radius:3px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--btn);border:0;cursor:pointer}
input.sw2{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;background:transparent;border:1.5px solid var(--fb);cursor:pointer;position:relative;flex-shrink:0;margin:0;transition:background .15s,border-color .15s}
input.sw2:checked{background:var(--check-on);border-color:var(--check-on)}
input.sw2::after{content:'';position:absolute;left:50%;top:46%;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translate(-50%,-50%) rotate(45deg) scale(0);transition:transform .15s}
input.sw2:checked::after{transform:translate(-50%,-50%) rotate(45deg) scale(1)}
#login .row{display:flex;gap:8px;margin-top:2px}
#login .row #kbtn{flex:0 0 auto;padding:10px 12px;font-size:12px}
#login .row #lbtn{flex:1}
#login.cap-off .h-captcha{display:none}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes down{from{opacity:0;transform:translateY(-6px)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media(max-width:768px){
#side{position:fixed;inset:0 auto 0 0;width:290px;z-index:1000;transform:translateX(-100%);background:var(--gl);backdrop-filter:blur(var(--sideblur)) saturate(180%);-webkit-backdrop-filter:blur(var(--sideblur)) saturate(180%);border-right:1px solid var(--gb)}
#side.show{transform:none}
#scrim.show{display:block;position:fixed;inset:0;background:#0005;z-index:999;animation:fade .2s}
#menubtn{display:flex}.m{max-width:86%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.banned-link{color:#2b7fff;cursor:pointer;text-decoration:underline}
.banned-link:hover{opacity:.8}
.m.banned-msg{opacity:.6;font-style:italic}
</style>
</head>
<body>

<div id="login">
<div class="card">
<h2>RedFox</h2>
<div id="fN"><div><label data-i="dname"></label><input class="fld" id="dn" maxlength="20" data-p="dnp"></div>
<div><label data-i="uname"></label><input class="fld" id="un" maxlength="10" data-p="unp"></div></div>
<div id="fK" class="hide"><label data-i="keyL"></label><input class="fld" id="kk" maxlength="5" autocomplete="off" data-p="keyP"></div>
<div class="h-captcha" data-sitekey="e71a81dc-0eb2-449e-b61e-0e006eb48e74" data-theme="dark" data-callback="onCap"></div>
<div class="err" id="lerr"></div>
<div class="row">
<button class="b g" id="kbtn" data-i="byKey"></button>
<button class="b" id="lbtn" data-i="signin"></button>
</div>
</div>
</div>

<div id="app" class="hide">
<div id="scrim"></div>
<aside id="side">
<div class="me-row">
<div class="av" id="meav"></div>
<div class="nm" id="menm"></div>
<button class="ib hide" id="admb"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></button>
<button class="ib" id="setb"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
<button class="ib" id="exitb"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
</div>
<input class="fld" id="q" data-p="search" autocomplete="off">
<div id="list"></div>
</aside>

<section id="main">

(()=>{const b=document.createElement('button');b.className='ib';b.id='plusb';b.title='Menu';b.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';$('setb').before(b);
b.onclick=e=>{e.stopPropagation();menuAt(b,[['New group or channel',newGroup],['Saved messages',()=>open(me.u,true)],['Contacts',contacts],['New story',newStory],['Avatar and link',profLink],['Accounts',accounts]])}})();
function menuAt(el,items){document.querySelectorAll('.ctx').forEach(x=>x.remove());const m=document.createElement('div');m.className='ctx';
items.forEach(([x,f])=>{const d=document.createElement('div');d.textContent=x;d.onclick=()=>{m.remove();f()};m.appendChild(d)});

setTimeout(()=>document.addEventListener('click',function f(){m.remove();document.removeEventListener('click',f)}),0)}

/* ---------- группы ---------- */
function watchG(p){const g=gid_(p);if(grpKnown.has(g))return;grpKnown.add(g);
on(db.ref('groups/'+g),s=>{const v=s.val();
 if(!v){if(GR[g]){delete GR[g];idx.delete(p);db.ref('userChats/'+me.u+'/'+p).remove();if(chat===p)open(globalDisabled?me.u:'global')}side();return}
 GR[g]=v;names.set(p,v.title);if(v.avatar&&IMG.test(v.avatar))AV[p]=v.avatar;else delete AV[p];side();hdr();comp()});
on(db.ref('members/'+g),s=>{const had=MB[g]&&MB[g][me.u];MB[g]=s.val()||{};
 if(had&&!MB[g][me.u]){idx.delete(p);db.ref('userChats/'+me.u+'/'+p).remove();if(chat===p)open(globalDisabled?me.u:'global');if(!leaving.has(g)&&GR[g])toast('You were removed from "'+GR[g].title+'"')}
 side();hdr();comp()})}
function newGroup(){
const o=modal(`<h3>New chat</h3>${dd('gt',[['group','Group'],['super','Supergroup'],['channel','Channel']],'group')}<input class="fld" id="gti" maxlength="30" placeholder="Title"><input class="fld" id="gn" maxlength="16" placeholder="name (a-z, 0-9, _ - !)"><div class="hint" id="gh">@name_${esc(me.u)}</div><textarea class="fld" id="gb" rows="2" maxlength="140" placeholder="Description"></textarea><button class="b" id="gc">Create</button>`);
const n=o.querySelector('#gn');n.oninput=()=>{n.value=n.value.toLowerCase();o.querySelector('#gh').textContent='@'+(n.value||'name')+'_'+me.u};
o.querySelector('#gc').onclick=async e=>{const b=e.currentTarget,ti=o.querySelector('#gti').value.trim(),nn=n.value.trim();
 if(!ti)return toast('Enter a title');if(!/^[a-z0-9_\-!]{1,16}$/.test(nn))return toast('Name: a-z, 0-9, _ - !');
 b.disabled=true;
 try{const un=nn+'_'+me.u,g=db.ref('groups').push().key,r=await db.ref('groupNames/'+un).transaction(c=>c===null?g:undefined);
  if(!r.committed){b.disabled=false;return toast('Name taken')}
  const up={};up['groups/'+g]={title:ti,username:un,type:o.querySelector('#gt').dataset.v,owner:me.u,bio:o.querySelector('#gb').value.trim(),at:Date.now()};
  up['members/'+g+'/'+me.u]='owner';up['userChats/'+me.u+'/g:'+g]=true;
  await db.ref().update(up);
  await db.ref('groupLog/'+g).push({type:'create',by:me.u,target:null,extra:ti,at:Date.now()});
  o.remove();watchG('g:'+g);open('g:'+g,true)
 }catch(x){console.error(x);toast('Failed to create');b.disabled=false}}}
async function groupInfo(g){
const G=GR[g];if(!G)return toast('Unavailable');
const mem=MB[g]||{},r=myRole(g),adm=r&&RK[r]>=2,p='g:'+g,us=Object.keys(mem).sort((a,b)=>RK[mem[b]]-RK[mem[a]]);
await Promise.all(us.filter(u=>!names.has(u)).map(async u=>{const v=(await db.ref('users/'+u+'/displayName').once('value')).val();if(v)names.set(u,v)}));
const o=modal(`<div style="display:flex;flex-direction:column;align-items:center;gap:4px">${avatar(p,0,1)}<b style="margin-top:10px;font-size:18px">${E(G.title)}</b><span class="hint">${TN[G.type]} · @${esc(G.username)}</span></div>${G.bio?`<div style="white-space:pre-wrap">${E(G.bio)}</div>`:''}<div class="grp">${us.map(u=>`<div class="bl" data-m="${esc(u)}" style="cursor:pointer"><span style="display:flex;align-items:center;gap:10px">${avatar(u)}<span>${E(nm(u))}</span></span><span class="hint">${RN[mem[u]]}</span></div>`).join('')}</div>${adm?'<button class="b" id="iv">Invite link</button><button class="b g" id="ed">Edit</button>':''}<button class="b g" id="lg">Event log</button>${r==='owner'?'<button class="b d" id="dl">Delete</button>':r?'<button class="b d" id="lv">Leave</button>':''}`),q=s=>o.querySelector(s);
o.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{const u=x.dataset.m;if(u===me.u)return;o.remove();if(r&&RK[r]>=2&&RK[mem[u]]<RK[r])manage(g,u);else profile(u)});
if(q('#iv'))q('#iv').onclick=()=>{o.remove();invite(g)};
if(q('#ed'))q('#ed').onclick=()=>{o.remove();editG(g)};
q('#lg').onclick=()=>{o.remove();glog(g)};
if(q('#dl'))q('#dl').onclick=()=>{o.remove();delGroup(g)};
if(q('#lv'))q('#lv').onclick=async()=>{o.remove();leaving.add(g);await db.ref('groupLog/'+g).push({type:'leave',by:me.u,target:null,extra:null,at:Date.now()});await db.ref('members/'+g+'/'+me.u).remove();await db.ref('userChats/'+me.u+'/'+p).remove()}}
function manage(g,u){const mr=myRole(g),tr=MB[g][u],opts=['admin','mod','member'].filter(x=>x!==tr&&RK[x]<RK[mr]);
const o=modal(`<h3>${E(nm(u))}</h3><div class="hint">${RN[tr]}</div>${opts.map(x=>`<button class="b g" data-r="${x}">Set: ${RN[x]}</button>`).join('')}<button class="b d" id="k">Remove</button>`);
o.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{o.remove();await db.ref('members/'+g+'/'+u).set(b.dataset.r);await db.ref('groupLog/'+g).push({type:'role',by:me.u,target:u,extra:b.dataset.r,at:Date.now()});toast('Done')});
o.querySelector('#k').onclick=async()=>{o.remove();await db.ref('members/'+g+'/'+u).remove();db.ref('userChats/'+u+'/g:'+g).remove().catch(()=>{});await db.ref('groupLog/'+g).push({type:'kick',by:me.u,target:u,extra:null,at:Date.now()});toast('Removed')}}
async function invite(g){const tk=db.ref('invites').push().key+Math.random().toString(36).slice(2,8);
await db.ref('invites/'+tk).set({g,by:me.u,at:Date.now()});const url=location.origin+location.pathname+'#join='+tk;
const o=modal(`<h3>Invitation</h3><input class="fld" id="u" readonly value="${esc(url)}"><button class="b" id="c">Copy</button>`);
o.querySelector('#c').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>{toast('Copied');o.remove()})}
async function joinTok(tk){const v=(await db.ref('invites/'+tk).once('value')).val();if(!v)return toast('Invalid link');
const g=v.g;if(!(await db.ref('groups/'+g).once('value')).exists())return toast('Group not found');
if(!(await db.ref('members/'+g+'/'+me.u).once('value')).exists()){await db.ref('members/'+g+'/'+me.u).set('member');await db.ref('groupLog/'+g).push({type:'join',by:me.u,target:null,extra:null,at:Date.now()})}
await db.ref('userChats/'+me.u+'/g:'+g).set(true);history.replaceState(null,'',location.pathname);watchG('g:'+g);open('g:'+g,true)}
function editG(g){const G=GR[g],o=modal(`<h3>Edit</h3><input class="fld" id="a" maxlength="30" value="${esc(G.title)}"><textarea class="fld" id="b" rows="3" maxlength="140" placeholder="Description">${esc(G.bio||'')}</textarea><input class="fld" id="c" placeholder="Avatar URL (https)" value="${esc(G.avatar||'')}"><button class="b" id="s">Save</button>`),q=s=>o.querySelector(s);
q('#s').onclick=async()=>{const ti=q('#a').value.trim(),av=q('#c').value.trim();if(!ti)return toast('Enter a title');if(av&&!IMG.test(av))return toast('Invalid link');
 try{await db.ref('groups/'+g).update({title:ti,bio:q('#b').value.trim(),avatar:av||null});await db.ref('groupLog/'+g).push({type:'edit',by:me.u,target:null,extra:null,at:Date.now()});o.remove();toast('Saved')}catch(e){toast('Failed')}}}
async function glog(g){const v=(await db.ref('groupLog/'+g).limitToLast(50).once('value')).val()||{},a=Object.values(v).sort((x,y)=>y.at-x.at);
const o=modal(`<h3>Event log</h3><div class="grp" style="max-height:50vh;overflow-y:auto">${a.map(x=>`<div class="bl" style="display:block"><div>${E(nm(x.by))} ${x.type}${x.target?' '+E(nm(x.target)):''}${x.extra?' · '+x.extra:''}</div><small class="hint">${fdate(x.at)}</small></div>`).join('')||'<div class="hint" style="padding:12px 0">Empty</div>'}</div>`)}
async function delGroup(g){const G=GR[g];if(!G||!(await ask('Delete?','The group and all history will be deleted for everyone.','Delete',1)))return;
const up={};up['groups/'+g]=null;up['members/'+g]=null;up['groupNames/'+G.username]=null;up['privateMessages/grp_'+g]=null;up['privatePins/grp_'+g]=null;up['groupLog/'+g]=null;
try{await db.ref().update(up)}catch(e){toast('Failed')}}

/* ---------- пересылка ---------- */
function fwd(m){const ps=[...new Set([me.u,...[...plist()].filter(p=>!isG(p)||canPost(p))])];
const o=modal(`<h3>Forward</h3><div class="grp">${ps.map(p=>`<div class="nav" data-p="${esc(p)}">${p===me.u?'<div class="av" style="background:#5b6bff;color:#fff">'+esc(t('savedShort'))+'</div><span>'+t('saved')+'</span>':avatar(p)+'<span>'+E(nm(p))+'</span>'}</div>`).join('')}</div>`);
o.onclick=async e=>{const n=e.target.closest('[data-p]');if(!n)return;const p=n.dataset.p;
 if(!isG(p)&&p!==me.u){if(blocked.has(p))return toast('Unblock this user first');if((await db.ref('blocks/'+p+'/'+me.u).once('value')).val())return toast('User has restricted messages')}
 o.remove();await db.ref(pathFor(p)).push({username:me.u,displayName:me.n,text:'↪ '+(m.displayName||m.username)+'\n'+m.text,time:Date.now()});
 if(!isG(p)&&p!==me.u){db.ref('userChats/'+me.u+'/'+p).set(true);db.ref('userChats/'+p+'/'+me.u).set(true);locl.delete(p)}toast('Forwarded')}}

/* ---------- истории ---------- */
function storiesActive(){const lim=Date.now()-864e5,r={};for(const u in ST){const a=Object.entries(ST[u]||{}).filter(([k,v])=>v&&v.at>lim).map(([k,v])=>({id:k,...v})).sort((x,y)=>x.at-y.at);if(a.length)r[u]=a}return r}
function newStory(){const o=modal(`<h3>New story</h3><textarea class="fld" id="t" rows="3" maxlength="200" placeholder="Text"></textarea><input class="fld" id="i" placeholder="Image URL (https)"><div class="hint">Story lives for 24 hours</div><button class="b" id="s">Publish</button>`);
o.querySelector('#s').onclick=async()=>{const tx=o.querySelector('#t').value.trim(),im=o.querySelector('#i').value.trim();
 if(!tx&&!im)return toast('Add text or image');if(im&&!IMG.test(im))return toast('Invalid link');
 try{await db.ref('stories/'+me.u).push({text:tx,img:im||null,at:Date.now()});o.remove();toast('Published')}catch(e){toast('Failed')}}}
function viewStory(u){const a=storiesActive()[u];if(!a)return;let i=0;const o=modal('<div id="sv" style="display:flex;flex-direction:column;gap:12px"></div>'),d=o.querySelector('#sv');
const paint=()=>{const s=a[i];d.innerHTML=`<div class="bl"><b>${E(nm(u))}</b><span class="hint">${i+1}/${a.length} · ${hm(s.at)}</span></div>${s.img&&IMG.test(s.img)?`<img src="${esc(s.img)}" referrerpolicy="no-referrer" style="width:100%;max-height:50vh;object-fit:contain;border-radius:14px">`:''}${s.text?`<div style="white-space:pre-wrap;word-break:break-word">${E(s.text)}</div>`:''}<div class="row">${u===me.u?'<button class="b g" id="sd">Delete</button>':''}<button class="b" id="snx">${i<a.length-1?'Next':'Close'}</button></div>`;
 d.querySelector('#snx').onclick=()=>{if(i<a.length-1){i++;paint()}else o.remove()};
 const sd=d.querySelector('#sd');if(sd)sd.onclick=async()=>{await db.ref('stories/'+u+'/'+s.id).remove();o.remove()}};paint()}

/* ---------- аватарка и ссылка ---------- */
function paintMe(){const m=$('meav');if(AV[me.u]){m.style.cssText="background:center/cover url('"+AV[me.u]+"')";m.textContent=''}else{m.textContent=ini(me.u);m.style.cssText=avStyle(me.u)}}
function profLink(){const o=modal(`<h3>Avatar and link</h3><input class="fld" id="a" placeholder="Avatar URL (https)" value="${esc(AV[me.u]||'')}"><input class="fld" id="l" placeholder="Profile link (https)" value="${esc(LK[me.u]||'')}"><button class="b" id="s">Save</button>`);
o.querySelector('#s').onclick=async()=>{const a=o.querySelector('#a').value.trim(),l=o.querySelector('#l').value.trim();
 if((a&&!IMG.test(a))||(l&&!IMG.test(l)))return toast('Invalid link');
 try{await db.ref('userAvatars/'+me.u).set(a||null);await db.ref('userLinks/'+me.u).set(l||null);o.remove();toast('Saved')}catch(e){toast('Failed')}}}

/* ---------- контакты ---------- */
async function contacts(){const ks=Object.keys(CT);
await Promise.all(ks.filter(u=>!names.has(u)).map(async u=>{const v=(await db.ref('users/'+u+'/displayName').once('value')).val();if(v)names.set(u,v)}));
const o=modal(`<h3>Contacts</h3><div class="grp">${ks.map(u=>`<div class="bl"><span data-o="${esc(u)}" style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1">${avatar(u)}<span>${E(nm(u))}</span></span><button class="ib" data-d="${esc(u)}"><svg viewBox="0 0 24 24">${IC.x}</svg></button></div>`).join('')||'<div class="hint" style="padding:12px 0">Empty</div>'}</div><div class="row"><input class="fld" id="n" maxlength="9" placeholder="username"><button class="b" id="a" style="flex:0 0 auto">+</button></div>`);
o.onclick=async e=>{const op=e.target.closest('[data-o]'),dl=e.target.closest('[data-d]');
 if(op){o.remove();return open(op.dataset.o,true)}
 if(dl){await db.ref('contacts/'+me.u+'/'+dl.dataset.d).remove();o.remove();return setTimeout(contacts,150)}
 if(e.target.closest('#a')){const u=o.querySelector('#n').value.trim().toLowerCase().replace(/^@/,'');if(!u||u===me.u)return;
  const v=(await db.ref('users/'+u).once('value')).val();if(!v)return toast(t('noUser'));names.set(u,v.displayName||u);
  await db.ref('contacts/'+me.u+'/'+u).set(true);o.remove();setTimeout(contacts,150)}}}

/* ---------- несколько аккаунтов ---------- */
const accs=()=>{try{return JSON.parse(localStorage.getItem('mg_accs')||'[]')}catch(e){return[]}};
function accounts(){const a=accs();
const o=modal(`<h3>Accounts</h3><div class="grp">${a.map(x=>`<div class="bl"><span data-s="${esc(x.u)}" style="cursor:pointer;flex:1">${esc(x.dn)} <span class="hint">@${esc(x.u)}${x.u===me.u?' · current':''}</span></span>${x.u===me.u?'':`<button class="ib" data-d="${esc(x.u)}"><svg viewBox="0 0 24 24">${IC.x}</svg></button>`}</div>`).join('')}</div><button class="b g" id="ad">Add account</button>`);
o.onclick=async e=>{const s=e.target.closest('[data-s]'),d=e.target.closest('[data-d]');
 if(d){localStorage.setItem('mg_accs',JSON.stringify(accs().filter(x=>x.u!==d.dataset.d)));o.remove();return accounts()}
 if(e.target.closest('#ad')){o.remove();return $('exitb').click()}
 if(s){const x=accs().find(y=>y.u===s.dataset.s);if(!x||x.u===me.u)return;
  const h=(await db.ref('users/'+x.u+'/passHash').once('value')).val();
  if(h){const p=await promptPass();if(p===null)return;if(await sha(p)!==h)return toast('Wrong password')}
  try{await db.ref('onlineUsers/'+me.u).remove()}catch(er){}refs.forEach(r=>r.off());
  sessionStorage.setItem('mg_auto',JSON.stringify({dn:x.dn,u:x.u}));location.reload()}}}

/* ---------- запуск ---------- */
function boot(dn,u){
const a=accs().filter(x=>x.u!==u);a.push({dn,u});localStorage.setItem('mg_accs',JSON.stringify(a));
on(db.ref('userAvatars'),s=>{const v=s.val()||{};AV={};for(const k in v)if(IMG.test(v[k]))AV[k]=v[k];
 for(const g in GR)if(GR[g].avatar&&IMG.test(GR[g].avatar))AV['g:'+g]=GR[g].avatar;paintMe();side();render();hdr()});
on(db.ref('userColors'),paintMe);
on(db.ref('userLinks'),s=>{LK=s.val()||{}});
on(db.ref('contacts/'+u),s=>{CT=s.val()||{}});
on(db.ref('stories'),s=>{ST=s.val()||{};const lim=Date.now()-864e5;
 for(const k in (ST[u]||{}))if(ST[u][k].at<=lim)db.ref('stories/'+u+'/'+k).remove().catch(()=>{});side()});
on(db.ref('userChats/'+u),s=>Object.keys(s.val()||{}).filter(isG).forEach(watchG));
const m=location.hash.match(/^#join=(\S+)$/);if(m)setTimeout(()=>joinTok(m[1]),600)}

/* ---------- поиск публичных групп ---------- */
let pq='',pubRes=[];
async function pubFind(q){pq=q;
const v=(await db.ref('publicGroups').orderByKey().startAt(q).endAt(q+'\uf8ff').limitToFirst(6).once('value')).val()||{};
const r=await Promise.all(Object.entries(v).map(async([un,g])=>{const G=(await db.ref('groups/'+g).once('value')).val();return G?{un,g,G}:null}));
if(pq===q){pubRes=r.filter(Boolean);side()}}
const _side2=side;
side=function(){_side2();if(!me)return;const q=$('q').value.trim().toLowerCase().replace(/^@/,'');
if(q.length<2){pubRes=[];pq='';return}
if(q!==pq)pubFind(q);
const rows=pubRes.filter(x=>!idx.has('g:'+x.g));
if(rows.length)$('list').insertAdjacentHTML('beforeend','<div class="sec">Public groups</div>'+rows.map(x=>`<div class="nav" data-pg="${esc(x.g)}"><div class="av">#</div><span><b style="display:block">${E(x.G.title)}</b><small class="hint">${TN[x.G.type]} · @${esc(x.un)}</small></span></div>`).join(''))};
$('q').oninput=side;
$('list').addEventListener('click',async e=>{const n=e.target.closest('[data-pg]');if(!n)return;const g=n.dataset.pg;
try{if(!(await db.ref('members/'+g+'/'+me.u).once('value')).exists()){await db.ref('members/'+g+'/'+me.u).set('member');await db.ref('groupLog/'+g).push({type:'join',by:me.u,target:null,extra:null,at:Date.now()})}
await db.ref('userChats/'+me.u+'/g:'+g).set(true);$('q').value='';watchG('g:'+g);open('g:'+g,true)}catch(x){toast('Failed to join')}});
const _gi=groupInfo;
groupInfo=async function(g){await _gi(g);const G=GR[g],r=myRole(g);if(!G||!r||RK[r]<2)return;
const md=[...document.querySelectorAll('.ov .md')].pop();if(!md)return;
const b=document.createElement('button');b.className='b g';b.textContent=G.pub?'Hide from search':'Make public';
b.onclick=async()=>{const up={};up['publicGroups/'+G.username]=G.pub?null:g;up['groups/'+g+'/pub']=!G.pub;
try{await db.ref().update(up);md.parentElement.remove();toast(G.pub?'Hidden from search':'Group is public')}catch(x){toast('Failed')}};
md.insertBefore(b,md.querySelector('#lg'))};

/* ---------- авто-вход ---------- */
try{const a=JSON.parse(sessionStorage.getItem('mg_auto')||'null');if(a){sessionStorage.removeItem('mg_auto');start(a.dn,a.u,1)}}catch(e){console.error(e)}
</script>
