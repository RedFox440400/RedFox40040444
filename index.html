<style>
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;-webkit-tap-highlight-color:transparent}

html,body{height:100%;overflow:hidden}
body{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t)}

.err{color:var(--d);font-size:13px;min-height:16px}
#app{height:100%;display:flex;position:relative}
#side{width:300px;background:var(--side);border-right:1px solid var(--l);display:flex;flex-direction:column;padding:12px;gap:10px;flex-shrink:0;transition:transform .25s}
.me-row{display:flex;align-items:center;gap:8px;padding:2px}
.me-row .nm{flex:1;min-width:0;cursor:pointer}
.nm b,.it b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sec{font-size:12px;color:var(--m);padding:12px 10px 4px}
.it{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:background .15s}
.it:hover{background:var(--h1)}.it.on{background:var(--h2)}
.it>div:nth-child(2){flex:1;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--av);color:var(--avt);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;position:relative;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}

.cnt{background:var(--btn);color:var(--btnt);border-radius:10px;padding:1px 7px;font-size:12px;font-weight:600}
#main{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:15px;user-select:none}
#chatview{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}

#hdr,#pinbar,#rbar,.pill,#warnbar{background:var(--gl)}
.ctx,.toast,.md{background:var(--gl2)}

#warnbar .wtxt{flex:1;min-width:0}

#pinbar{position:absolute;top:68px;left:12px;right:12px;z-index:4;border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}

#send{background:var(--btn);color:var(--btnt)}
.ctx{position:fixed;z-index:9000;min-width:200px;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);max-height:60vh;overflow-y:auto}
.ctx div{padding:11px 16px;cursor:pointer;font-size:14px}

.row{display:flex;gap:10px}.row>*{flex:1}

.ir{display:flex;align-items:center;gap:14px;padding:12px 0}
.ir+.ir{border-top:1px solid var(--gb)}
.ir div{min-width:0;word-break:break-word;white-space:pre-wrap}
.ir small{display:block;color:var(--m);font-size:12px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);color:var(--t);padding:10px 18px;border-radius:12px;font-size:14px;z-index:99999;background:var(--gl2);border:1px solid var(--gb);box-shadow:0 8px 32px rgba(0,0,0,.25)}
#scrim{display:none}
::placeholder{color:var(--m)}
.sth{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.sth b{flex:1;font-size:17px;font-weight:600}
.sb{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px}
.sb>*{flex-shrink:0}
.lb{display:block;font-size:12px;color:var(--m);margin:0 0 6px 4px}
.nav{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer}
.nav+.nav{border-top:1px solid var(--gb)}
.nav>span{flex:1;min-width:0}
.nav em{font-style:normal;color:var(--m);font-size:14px}
.sw{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:var(--m)}
.sw i.au{background:var(--g)}.sw i.on{outline:2px solid var(--t);outline-offset:2px}
.kbox{font:600 28px ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center;padding:18px;border-radius:16px;user-select:all;word-break:break-all;background:var(--soft);border:1px solid var(--gb)}
input.sw2{appearance:none;width:22px;height:22px;border-radius:7px;background:transparent;border:1.5px solid var(--fb);cursor:pointer;position:relative;flex-shrink:0}
input.sw2:checked{background:#5a5a5a;border-color:#5a5a5a}
input.sw2::after{content:'';position:absolute;left:50%;top:46%;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translate(-50%,-50%) rotate(45deg) scale(0)}
input.sw2:checked::after{transform:translate(-50%,-50%) rotate(45deg) scale(1)}
body.blurred #main,body.blurred #side{filter:blur(16px);transition:filter .2s}
.story-bar{display:flex;gap:10px;overflow-x:auto;padding:8px 4px}
.story{width:64px;flex-shrink:0;text-align:center;cursor:pointer}
.story .ring{width:60px;height:60px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f59e0b,#e5534b,#2b7fff);display:flex;align-items:center;justify-content:center;margin:0 auto}

.member{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--gb)}
.member:first-child{border-top:0}
.role{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--hv2);color:var(--m)}
.role.owner{background:#e5534b33;color:#e5534b}
.role.admin{background:#2b7fff33;color:#2b7fff}

@media(max-width:768px){
#side{position:absolute;inset:0;width:100%;z-index:100;background:var(--bg);border:0;padding:12px;transform:none;transition:transform .25s ease}

#backbtn{display:flex}

#placeholder{display:none!important}

@media(min-width:769px){

}
</style>
</head>

  return `<div class="av${big?' big':''}" style="${avStyle(u)}">${esc(ini(u))}${dot&&online.has(u)?'<i></i>':''}</div>`;
};
const room=p=>'private_'+[me.u,p].sort().join('_');
const gpath=g=>'groups/'+g;
const gmsg=g=>'groupMessages/'+g;
const pathFor=p=>p==='global'?'messages/':p==='saved'?'savedMessages/'+me.u+'/':'privateMessages/'+room(p)+'/';

function toast(x){const e=document.createElement('div');e.className='toast';e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function modal(h,cls){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="md '+(cls||'')+'">'+h+'</div>';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);return o}
function ask(ti,p,ok,danger){return new Promise(r=>{const o=modal(`<h3>${ti}</h3><p>${p}</p><div class="row"><button class="b g" id="n">Cancel</button><button class="b ${danger?'d':''}" id="y">${ok}</button></div>`);o.querySelector('#n').onclick=()=>{o.remove();r(false)};o.querySelector('#y').onclick=()=>{o.remove();r(true)}})}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('msg:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const hm=x=>new Date(x).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
function dayLabel(x){const d=new Date(x),n=new Date(),s=y=>new Date(y.getFullYear(),y.getMonth(),y.getDate()).getTime(),df=(s(n)-s(d))/864e5;return df===0?'Today':df===1?'Yesterday':d.toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'})}
function on(ref,fn){ref.on('value',fn);refs.push(ref)}
function offAll(){refs.forEach(r=>r.off());refs=[];Object.values(groupListeners).forEach(r=>r.off());groupListeners={}}

/* ============ LOGIN ============ */
const lerr=x=>{$('lerr').textContent=x};
async function loginKey(){
  const k=$('kk').value.trim();if(!k)return lerr('Invalid key');
  lerr('');$('lbtn').disabled=true;
  try{
    const h=await sha('k:'+k);
    const r=(await db.ref('keys/'+h).once('value')).val();
    const x=r&&r.u?(await db.ref('users/'+r.u).once('value')).val():null;
    if(!x)return lerr('Invalid key');
    start(x.displayName,r.u);
  }catch(e){console.error(e);lerr('Cannot reach the server')}
  finally{$('lbtn').disabled=false}
}
async function login(){
  const dn=$('dn').value.trim(),u=$('un').value.trim().toLowerCase().replace(/^@/,'');
  if(!dn||dn.length>20)return lerr('Name must be 1 to 20 characters');
  if(!/^[a-z0-9_\-!]{1,9}$/.test(u))return lerr('Username: a-z, 0-9, _ - ! (up to 9 characters)');
  lerr('');$('lbtn').disabled=true;
  try{
    const x=(await db.ref('users/'+u).once('value')).val();
    if(x){if(x.displayName!==dn)return lerr('This username belongs to a different name')}
    else await db.ref('users/'+u).set({displayName:dn,username:u,createdAt:Date.now()});
    start(dn,u);
  }catch(e){console.error(e);lerr('Cannot reach the server')}
  finally{$('lbtn').disabled=false}
}

/* ============ START ============ */
function start(dn,u,auto){
  me={n:dn,u};names.set(u,dn);
  try{localStorage.setItem('mg_last',JSON.stringify({dn,u}))}catch(e){}
  try{
    lastRead=JSON.parse(localStorage.getItem(LS('lr'))||'{}');
    cleared=JSON.parse(localStorage.getItem(LS('cl'))||'{}');
    contacts=JSON.parse(localStorage.getItem(LS('contacts'))||'{}');
    globalOn=localStorage.getItem(LS('global'))!=='0';
    muteUntil=+localStorage.getItem(LS('mute'))||0;
  }catch(e){}
  autoDel=+localStorage.getItem(LS('ad'))||0;

  $('login').classList.add('hide');$('app').classList.remove('hide');
  const mv=$('meav');mv.textContent=ini(u);mv.style.cssText=avStyle(u);
  $('menm').innerHTML=`<b>${esc(dn)}</b><small>@${esc(u)}</small>`;

  const pr=db.ref('onlineUsers/'+u),ls=db.ref('users/'+u+'/lastSeen');
  const beat=()=>{pr.set({username:u,displayName:dn,lastSeen:Date.now()});ls.set(Date.now())};
  beat();pr.onDisconnect().remove();ls.onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
  setInterval(beat,10000);

  on(db.ref('onlineUsers'),s=>{
    const m=new Map(),v=s.val()||{};
    for(const k in v){const x=v[k];if(x&&x.username&&Date.now()-x.lastSeen<35000){m.set(x.username,1);if(x.displayName)names.set(x.username,x.displayName)}}
    online=m;side();hdr();
  });
  on(db.ref('blocks/'+u),s=>{blocked=new Set(Object.keys(s.val()||{}));side();comp();render()});
  on(db.ref('bans'),s=>{bans=s.val()||{};side();render()});
  on(db.ref('userBadges'),s=>{badges={};const v=s.val()||{};for(const k in v)badges[k]=v[k].type;side();render();hdr()});
  on(db.ref('messages').orderByChild('time').limitToLast(MAX),s=>{
    const a=[];s.forEach(c=>{const m={id:c.key,...c.val()};a.push(m);if(m.username&&m.displayName)names.set(m.username,m.displayName)});
    C.global=a;if(chat==='global')render();side();
  });
  on(db.ref('userChats/'+u),s=>{idx=new Set(Object.keys(s.val()||{}));idx.forEach(listen);side()});
  on(db.ref('users'),s=>{const v=s.val()||{};for(const k in v)if(v[k].displayName)names.set(k,v[k].displayName)});
  on(db.ref('groups'),s=>{
    groups=s.val()||{};
    const mine=new Set();
    for(const g in groups)if(groups[g].members&&groups[g].members[u])mine.add(g);
    myGroups=mine;
    mine.forEach(g=>listenGroup(g));
    side();hdr();
  });
  on(db.ref('stories'),s=>{stories=s.val()||{};side()});
  on(db.ref('contacts/'+u),s=>{contacts=s.val()||{};side()});
  on(db.ref('savedMessages/'+me.u),s=>{const a=[];s.forEach(c=>a.push({id:c.key,...c.val()}));C.saved=a;if(chat==='saved')render();side()});

  setInterval(expire,5000);
  window.addEventListener('blur',()=>{if(antishare)document.body.classList.add('blurred')});
  window.addEventListener('focus',()=>document.body.classList.remove('blurred'));
  document.addEventListener('visibilitychange',()=>{if(antishare)document.body.classList.toggle('blurred',document.hidden)});

  showPlaceholder();
  side();
}

/* ============ LISTENERS ============ */
function listen(p){
  if(p==='saved'||att[p])return;
  att[p]=1;
  const r=db.ref('privateMessages/'+room(p)).limitToLast(200);
  on(r,s=>{
    const a=[];s.forEach(c=>{const m={id:c.key,...c.val()};a.push(m);if(m.username===p&&m.displayName)names.set(p,m.displayName);if(m.username===me.u)writtenTo.add(p)});
    C[p]=a;
    if(lastRead[p]===undefined||chat===p)markRead(p);
    if(chat===p)render();side();
  });
}
function listenGroup(g){
  if(groupListeners[g])return;
  const r=db.ref(gmsg(g)).limitToLast(200);
  const fn=s=>{
    const a=[];s.forEach(c=>{const m={id:c.key,...c.val()};a.push(m);if(m.username&&m.displayName)names.set(m.username,m.displayName)});
    C[g]=a;
    if(chat===g)render();side();
  };
  r.on('value',fn);groupListeners[g]=r;
  const pr=db.ref('groupPins/'+g);
  pr.on('value',s=>{groupPins[g]=(s.val()||{}).messageId||null;if(chat===g)renderPin()});
  refs.push(pr);
}
const plist=()=>new Set([...idx,...locl,...myGroups]);
const visible=(list,p)=>{
  const now=Date.now(),c=cleared[p]||0;
  return (list||[]).filter(m=>!(m.expireAt&&m.expireAt<=now)&&m.time>c&&!blocked.has(m.username));
};
function markRead(p){const a=C[p]||[];lastRead[p]=a.length?a[a.length-1].time:Date.now();save()}
const unread=p=>visible(C[p],p).filter(m=>m.username===p&&m.time>(lastRead[p]||0)).length;
const lastT_=p=>{const a=C[p]||[];return a.length?a[a.length-1].time:0};

/* ============ SIDEBAR ============ */
function side(){
  if(!me)return;
  const q=$('q').value.trim().toLowerCase();
  let h='';

  const storyList=Object.keys(stories).filter(u=>stories[u]&&stories[u].time&&Date.now()-stories[u].time<86400000);
  if(storyList.length){
    h+=`<div class="story-bar">`;
    h+=`<div class="story" data-story="${me.u}"><div class="ring${stories[me.u]?'':' seen'}">${avatar(me.u)}</div><small>My story</small></div>`;
    storyList.filter(u=>u!==me.u).forEach(u=>{
      h+=`<div class="story" data-story="${esc(u)}"><div class="ring">${avatar(u)}</div><small>${esc(nm(u))}</small></div>`;
    });
    h+=`</div>`;
  }

  if(globalOn&&!q)h+=`<div class="it ${chat==='global'?'on':''}" data-u="global"><div class="av">#</div><div><b>Global chat</b><small>${online.size} online</small></div></div>`;
  else if(globalOn&&q&&'global chat'.includes(q))h+=`<div class="it ${chat==='global'?'on':''}" data-u="global"><div class="av">#</div><div><b>Global chat</b><small>${online.size} online</small></div></div>`;

  h+=`<div class="it ${chat==='saved'?'on':''}" data-u="saved"><div class="av">★</div><div><b>Saved Messages</b><small>Your saved messages</small></div></div>`;

  let c=q?[...names.keys()].filter(u=>u!==me.u&&(u.includes(q)||nm(u).toLowerCase().includes(q))):[...plist()];
  c=c.filter(u=>!groups[u]);
  c.sort((a,b)=>lastT_(b)-lastT_(a));

  const row=u=>{
    const n=unread(u);
    return `<div class="it ${chat===u?'on':''}" data-u="${esc(u)}">${avatar(u,1)}<div><b>${E(nm(u))}</b><small>@${esc(u)}${blocked.has(u)?' · blocked':''}</small></div>${n?`<span class="cnt">${n}</span>`:''}</div>`;
  };
  if(c.length)h+=`<div class="sec">${q?'Results':'Chats'}</div>`+c.map(row).join('');

  const gl=[...myGroups].filter(g=>groups[g]);
  if(gl.length){
    h+=`<div class="sec">Groups</div>`;
    gl.forEach(g=>{
      const G=groups[g];
      if(q&&!nm(g).toLowerCase().includes(q)&&!g.includes(q))return;
      h+=`<div class="it ${chat===g?'on':''}" data-u="${esc(g)}"><div class="av">${G.type==='channel'?'📢':G.type==='supergroup'?'👥':'#'}</div><div><b>${E(G.name)}</b><small>@${esc(g)} · ${Object.keys(G.members||{}).length} members</small></div></div>`;
    });
  }

  const o=[...online.keys()].filter(u=>u!==me.u&&!plist().has(u)&&!blocked.has(u));
  if(o.length&&!q)h+=`<div class="sec">Online</div>`+o.map(row).join('');

  $('list').innerHTML=h;
}

/* ============ OPEN ============ */
function open(p,fromList){
  if(p==='saved'){
    const r=db.ref('savedMessages/'+me.u);
    if(!att.saved){att.saved=1;on(r,s=>{const a=[];s.forEach(c=>a.push({id:c.key,...c.val()}));C.saved=a;if(chat==='saved')render();side()})}
  }else if(p!=='global'&&!groups[p]){
    if(fromList&&!idx.has(p))locl.add(p);
    listen(p);
    markRead(p);
    if(typRef){typRef.off();typRef=null}
    typRef=db.ref('typing/'+room(p));
    typRef.on('value',s=>{const v=s.val()||{};typing=!!v[p]&&Date.now()-v[p]<5000;hdr()});
    db.ref('privatePins/'+room(p)).off();
    db.ref('privatePins/'+room(p)).on('value',s=>{if(chat===p){pin=(s.val()||{}).messageId||null;renderPin()}});
  }else if(groups[p]){
    listenGroup(p);
    const pr=db.ref('groupPins/'+p);
    pr.on('value',s=>{if(chat===p){pin=(s.val()||{}).messageId||null;renderPin()}});
  }
  chat=p;seen=new Set();cancelReply();pin=null;typing=false;
  openChatView();hdr();comp();render(true);renderPin();side();
  showWarning();
  if(!isMobile()&&window.innerWidth>768)$('inp').focus();
}

/* ============ HEADER ============ */
function hdr(){
  if(!me||!chat)return;
  if(chat==='global'){$('ht').innerHTML='Global chat';$('hs').textContent=online.size+' online'}
  else if(chat==='saved'){$('ht').innerHTML='Saved Messages';$('hs').textContent='Your saved messages'}
  else if(groups[chat]){
    const G=groups[chat];
    $('ht').innerHTML=E(G.name)+` <span style="font-size:11px;color:var(--m)">@${esc(chat)}</span>`;
    $('hs').textContent=(G.type==='channel'?'📢 Channel':G.type==='supergroup'?'👥 Supergroup':'# Group')+' · '+Object.keys(G.members||{}).length+' members';
  }else{
    $('ht').innerHTML=E(nm(chat));
    $('hs').textContent=typing?'typing…':online.has(chat)?'online':'offline';
  }
  $('mb').classList.toggle('hide',chat==='global'||chat==='saved');
}

/* ============ RENDER ============ */
function render(init){
  if(!chat)return;
  const box=$('msgs'),top=box.scrollTop,near=box.scrollHeight-top-box.clientHeight<140;
  const all=C[chat]||[],list=visible(all,chat);
  let h='<div class="wm"></div>',day='',scroll=!!init||near;
  if(!list.length){box.innerHTML=h+`<div class="empty">No messages yet</div>`;return}
  list.forEach((m,i)=>{
    const g=(a,b)=>a&&b&&a.username===b.username&&Math.abs(a.time-b.time)<3e5&&dayLabel(a.time)===dayLabel(b.time);
    const tail=!g(m,list[i+1]);
    const d=dayLabel(m.time);if(d!==day){day=d;h+=`<div class="day"><span>${d}</span></div>`}
    const mine=m.username===me.u;
    const isNew=!init&&!seen.has(m.id);seen.add(m.id);
    if(isNew&&mine&&mineNew){scroll=true;mineNew=false}
    const dead=isBanned(m.username)&&!mine;
    let rp='';
    if(!dead&&m.replyTo){const o=all.find(x=>x.id===m.replyTo);rp=`<div class="rp" data-go="${m.replyTo}"><b>${esc(o?o.displayName:m.replyToSender||'')}</b>${o?E(o.text.slice(0,70)):'…'}</div>`}
    let fw='';
    if(!dead&&m.forwardedFrom)fw=`<div class="fw">Forwarded from ${esc(m.forwardedFrom)}</div>`;
    const nameHtml=dead?`<div class="sn dead">Account is unavailable</div>`:`<div class="sn" data-u="${esc(m.username)}">${esc(m.displayName||m.username)}</div>`;
    const body=dead
      ? `This message cannot be displayed. <span class="mdlink" data-dead="${esc(m.username)}">More details..</span>`
      : E(m.text);
    h+=`<div class="m ${mine?'me':'ot'}${tail?' tail':''}${i===0||!g(list[i-1],m)?' first':''}" data-id="${m.id}">${!mine&&chat==='global'?nameHtml:''}${fw}${rp}<span class="${dead?'deadmsg':''}">${body}</span><small>${m.edited?'✎ ':''}${hm(m.time)}</small></div>`;
  });
  box.innerHTML=h;
  box.scrollTop=scroll?box.scrollHeight:top;
  if(chat!=='global')renderPin();
}
function go(id){const e=document.querySelector(`.m[data-id="${id}"]`);if(!e)return toast('Message not found');e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('fl');setTimeout(()=>e.classList.remove('fl'),1200)}
function renderPin(){
  if(!chat)return;
  const m=pin&&chat!=='global'?visible(C[chat],chat).find(x=>x.id===pin):null,b=$('pinbar');
  b.classList.toggle('hide',!m);layoutPads();
  if(m)b.querySelector('span').innerHTML=E('Pinned: '+m.text.slice(0,60));
}
$('pinbar').onclick=e=>{if(e.target.closest('button'))unpin();else if(pin)go(pin)};
async function unpin(){
  if(groups[chat])await db.ref('groupPins/'+chat).remove();
  else await db.ref('privatePins/'+room(chat)).remove();
  toast('Unpinned');
}
async function pinMsg(m){
  if(groups[chat])await db.ref('groupPins/'+chat).set({messageId:m.id,by:me.u,at:Date.now()});
  else await db.ref('privatePins/'+room(chat)).set({messageId:m.id,by:me.u,at:Date.now()});

function ctx(e,m){
  document.querySelectorAll('.ctx').forEach(x=>x.remove());
  const mine=m.username===me.u,menu=document.createElement('div');menu.className='ctx';
  const add=(x,f,c)=>{const d=document.createElement('div');d.textContent=x;if(c)d.className=c;d.onclick=()=>{menu.remove();f()};menu.appendChild(d)};
  menu.innerHTML=`<div class="tm">${new Date(m.time).toLocaleString('en-US')}</div>`;
  if(!isBanned(m.username)||mine){
    add('Reply',()=>setBar('reply',m));
    add('Copy',()=>{navigator.clipboard&&navigator.clipboard.writeText(m.text).then(()=>toast('Copied'))});
    add('Forward',()=>forwardDialog(m));
  }
  if(chat&&chat!=='global'&&chat!=='saved'&&!groups[chat])add(pin===m.id?'Unpin':'Pin',()=>pin===m.id?unpin():pinMsg(m));
  if(chat&&chat!=='saved')add('Save',()=>{db.ref('savedMessages/'+me.u).push({username:me.u,displayName:'Saved Messages',text:m.text,time:Date.now(),forwardedFrom:nm(m.username)});toast('Saved')});
  if(mine){
    add('Edit',()=>setBar('edit',m));
    add('Delete for me',async()=>{if(await ask('Delete message?','This action cannot be undone.','Delete',1))db.ref(pathFor(chat)+m.id).remove().then(()=>toast('Deleted'))});
    add('Delete for everyone',async()=>{if(await ask('Delete for everyone?','The message will disappear for everyone.','Delete',1)){db.ref(pathFor(chat)+m.id).remove();toast('Deleted for everyone')}},'dd');
  }
  document.body.appendChild(menu);
  const r=menu.getBoundingClientRect();
  menu.style.left=Math.max(8,Math.min(e.clientX,innerWidth-r.width-8))+'px';
  menu.style.top=Math.max(8,Math.min(e.clientY,innerHeight-r.height-8))+'px';
  setTimeout(()=>document.addEventListener('click',function f(){menu.remove();document.removeEventListener('click',f)}),0);
}
function forwardDialog(m){
  const o=modal(`<h3>Forward</h3><input class="fld" id="fq" placeholder="Search"><div class="grp" id="fl" style="max-height:300px;overflow:auto;margin-top:8px"></div>`);
  const draw=()=>{
    const q=o.querySelector('#fq').value.trim().toLowerCase();
    const items=[...plist()].filter(u=>u!==me.u&&(!q||u.includes(q)||nm(u).toLowerCase().includes(q)));
    o.querySelector('#fl').innerHTML=items.map(u=>`<div class="bl" data-f="${esc(u)}"><span>${esc(nm(u))}</span><button class="b">→</button></div>`).join('')||'<div class="hint">Nobody found</div>';
  };
  draw();

/* ============ SEND ============ */
async function send(){
  const inp=$('inp'),x=inp.value.trim();if(!x||!me||!chat)return;
  const clr=()=>{inp.value='';fit()};

  if(chat==='global'&&hasMat(x)){
    clr();
    if(Date.now()<muteUntil){toast('You are temporarily muted in the global chat');return}
    const m={username:me.u,displayName:me.n,text:x,time:Date.now()};
    const ref=await db.ref('messages').push(m);
    await ref.remove();
    const isAdm=badges[me.u]==='admin'||me.u==='admin11';
    const isVer=badges[me.u]==='checked'||isAdm;
    const dur=isAdm?0:isVer?60*1000:5*60*1000;
    if(dur>0){
      muteUntil=Date.now()+dur;
      localStorage.setItem(LS('mute'),muteUntil);
      setTimeout(()=>{muteUntil=0;localStorage.removeItem(LS('mute'))},dur);
    }
    modal(`<h3>Profanity is not allowed</h3><p>In the global chat you cannot insult anyone or use profanity.</p>${dur>0?`<p>You cannot write in the global chat for ${isVer?'1 minute':'5 minutes'}.</p>`:''}<button class="b g" id="ok">Got it</button>`).querySelector('#ok').onclick=e=>e.target.closest('.ov').remove();
    return;
  }

  if(Date.now()<muteUntil&&chat==='global'){toast('You are temporarily muted in the global chat');return}

  if(editing){
    const id=editing.id,old=editing.text;cancelReply();
    if(x!==old)await db.ref(pathFor(chat)+id).update({text:x,edited:true});
    clr();return;
  }
  const m={username:me.u,displayName:me.n,text:x,time:Date.now()};
  if(reply){m.replyTo=reply.id;m.replyToSender=reply.name}
  if(autoDel>0&&chat!=='global'&&chat!=='saved'&&!groups[chat])m.expireAt=m.time+autoDel*1000;
  clr();cancelReply();mineNew=true;
  if(chat==='global'){await db.ref('messages').push(m);trim()}
  else if(chat==='saved'){await db.ref('savedMessages/'+me.u).push(m)}
  else if(groups[chat]){await db.ref(gmsg(chat)).push(m)}
  else{
    await db.ref(pathFor(chat)).push(m);
    const p=chat;locl.delete(p);writtenTo.add(p);
    db.ref('userChats/'+me.u+'/'+p).set(true);
    db.ref('userChats/'+p+'/'+me.u).set(true);
    db.ref('typing/'+room(p)+'/'+me.u).remove();
  }
}
async function trim(){
  const v=(await db.ref('messages').once('value')).val()||{};
  const k=Object.keys(v).sort((a,b)=>v[a].time-v[b].time);
  k.slice(0,Math.max(0,k.length-MAX)).forEach(i=>db.ref('messages/'+i).remove());
}
function expire(){
  let ch=false,now=Date.now();
  for(const p in C)C[p].forEach(m=>{if(m.expireAt&&m.expireAt<=now&&!m._x){m._x=1;ch=true;if(m.username===me.u&&!groups[p])db.ref(pathFor(p)+m.id).remove()}});
  if(ch){render();side()}
}
$('send').onclick=send;
$('inp').onkeydown=e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  const ctrl=e.ctrlKey||e.metaKey;
  if(!e.shiftKey&&!ctrl){e.preventDefault();send()}
};
$('inp').oninput=()=>{

};

['dn','un','kk'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter')login()});
$('un').oninput=e=>{e.target.value=e.target.value.replace(/^@/,'').toLowerCase()};
let keyMode=false;
$('kbtn').onclick=()=>{keyMode=!keyMode;$('fN').classList.toggle('hide',keyMode);$('fK').classList.toggle('hide',!keyMode);$('kbtn').textContent=keyMode?'Back':'Sign in with key';lerr('')};
$('exitb').onclick=async()=>{try{await db.ref('onlineUsers/'+me.u).remove()}catch(e){}offAll();location.reload()};
window.addEventListener('resize',()=>{
  if(!isMobile()){
    $('side').classList.remove('hidden');
    if(chat)$('main').classList.add('open');
    else $('main').classList.remove('open');
  }else{
    if(chat){$('side').classList.add('hidden');$('main').classList.add('open')}
    else{$('side').classList.remove('hidden');$('main').classList.remove('open')}
  }
});

/* ============ INIT ============ */
try{
  const l=JSON.parse(localStorage.getItem('mg_last')||'null');
  if(l){$('dn').value=l.dn;$('un').value=l.u}
}catch(e){}
try{
  const a=JSON.parse(sessionStorage.getItem('mg_auto')||'null');
  if(a){sessionStorage.removeItem('mg_auto');start(a.dn,a.u,1)}
}catch(e){}
</script>
</body>
</html>
