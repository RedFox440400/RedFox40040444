<style>

.m { width: fit-content; max-width: min(78%, 520px); padding: 7px 12px 6px; border-radius: var(--r); line-height: 1.35; cursor: pointer; word-break: break-word; white-space: pre-wrap; transition: background .4s, border-radius .2s; }

input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; width: 100%; }

#login .row { display: flex; gap: 8px; margin-top: 2px; }

const auth = firebase.auth();

const $ = id => document.getElementById(id);

const AUTH_DOMAIN = '@redfox.app';

async function authUser(username, password) {
  const email = username + AUTH_DOMAIN;
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    return cred.user;
  } catch (e) {
    if (
      e.code === 'auth/user-not-found' ||
      e.code === 'auth/invalid-login-credentials' ||
      e.code === 'auth/invalid-credential'
    ) {
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        return cred.user;
      } catch (e2) {
        if (e2.code === 'auth/email-already-in-use') {
          const err = new Error('Wrong password');
          err.code = 'auth/wrong-password';
          throw err;
        }
        throw e2;
      }
    }
    throw e;
  }
}

async function bindUid(username, uid) {
  await db.ref('users/' + username + '/uid').set(uid);
  await db.ref('uids/' + uid).set(username);
}

function on(ref, fn) { ref.on('value', fn); refs.push(ref); }
function listen(p) {

async function legacyScan() {

const plist = () => new Set([...idx, ...locl]);

function markRead(p) { const a = C[p] || []; lastRead[p] = a.length ? a[a.length - 1].time : Date.now(); save(); }
const unread = p => visible(C[p], p).filter(m => m.username === p && m.time > (lastRead[p] || 0)).length;
const lastT_ = p => { const a = C[p] || []; return a.length ? a[a.length - 1].time : 0; };

function render(init) {
  const box = $('msgs');
  const top = box.scrollTop;
  const near = box.scrollHeight - top - box.clientHeight < 140;
  const all = C[chat] || [];
  const list = visible(all, chat);
  let h = '', day = '', scroll = !!init || near;
  list.forEach((m, i) => {
    const g = (a, b) => a && b && a.username === b.username && Math.abs(a.time - b.time) < 3e5 && dayLabel(a.time) === dayLabel(b.time);
    const tail = !g(m, list[i + 1]);

    const d = dayLabel(m.time);
    if (d !== day) { day = d; h += '<div class="day"><span>' + E(d) + '</span></div>'; }

    if (isNew && mine && mineNew) { scroll = true; mineNew = false; }
    const banned = bans[m.username] && (bans[m.username].until === 0 || bans[m.username].until > Date.now());
    let rp = '';
    if (m.replyTo && !banned) {
      const o = all.find(x => x.id === m.replyTo);

function ctx(e, m) {

  menu.innerHTML = '<div class="tm">' + new Date(m.time).toLocaleString(loc(), { hour12: h12() }) + '</div>';

  add(t('forward'), () => fwd(m));

  if (mine) {
    add(t('edit'), () => setBar('edit', m));
    add(t('del'), async () => { if (await ask(t('delQ'), t('noUndo'), t('del'), 1)) db.ref(pathFor(chat) + m.id).remove().then(() => toast(t('deleted'))); }, 'dd');
  }
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(e.clientX, innerWidth - r.width - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(e.clientY, innerHeight - r.height - 8)) + 'px';
  setTimeout(() => document.addEventListener('click', function f() { menu.remove(); document.removeEventListener('click', f); }), 0);
}

function parseBtn(x) {

  const c = y => y.trim().replace(/^\(|\)$/g, '').trim();
  const btn = c(p[0]), msg = c(p[1]), link = c(p.slice(2).join(','));
  return btn && msg && okLink(link) ? { btn, msg, link } : null;
}

async function sendPhoto() {

async function send() {
  const inp = $('inp');
  const x = inp.innerText.trim();
  if (!x || !me || banEl) return;
  const clr = () => { inp.innerText = ''; fit(); };
  if (x[0] === '/' && await cmd(x)) { clr(); return; }
  if (editing) {
    const id = editing.id, old = editing.text;
    cancelReply();
    if (x !== old) await db.ref(pathFor(chat) + id).update({ text: x, edited: true });
    clr();
    return;
  }
  if (chat !== 'global' && !isG(chat) && chat !== me.u) {
    if (blocked.has(chat)) return toast(t('unblockFirst'));
    if ((await db.ref('blocks/' + chat + '/' + me.u).once('value')).val()) return toast(t('restricted'));
  }
  if (isG(chat) && !canPost(chat)) return toast(t('onlyAdminsCanPost'));
  if (chat === 'global' && containsMat(x)) {
    if (Date.now() < mutedUntil) return toast(t('matMuted').replace('{n}', mutedText()));
    const role = badges[me.u] || (me.u === 'admin11' ? 'admin' : null);
    let muteSec = 5 * 60;
    if (role === 'admin') muteSec = 0;
    else if (role === 'checked') muteSec = 60;
    mutedUntil = Date.now() + muteSec * 1000;
    if (muteSec > 0) toast(t('matWarning').replace('{n}', mutedText()));
    clr();
    return;
  }
  let bp = null;
  if (x.startsWith('.Buttons')) {
    if (chat === 'global' && !badges[me.u] && me.u !== 'admin11') return toast(t('verifiedOnly'));
    bp = parseBtn(x);
    if (!bp) return toast(t('btnFmt'));
  }
  const m = { username: me.u, displayName: me.n, text: bp ? bp.msg : x, time: Date.now() };
  if (bp) { m.isButton = true; m.buttonText = bp.btn; m.buttonLink = bp.link; }
  if (reply) { m.replyTo = reply.id; m.replyToSender = reply.name; }
  if (autoDel > 0 && chat !== 'global' && chat !== me.u) m.expireAt = m.time + autoDel * 1000;
  clr();
  cancelReply();
  mineNew = true;
  if (chat === 'global') {
    await db.ref('messages').push(m);
    trim();
  } else {
    await db.ref(pathFor(chat)).push(m);
    const p = chat;
    if (p !== me.u) {
      locl.delete(p);
      writtenTo.add(p);
      db.ref('userChats/' + me.u + '/' + p).set(true);
      db.ref('userChats/' + p + '/' + me.u).set(true);
    }
    db.ref('typing/' + room(p) + '/' + me.u).remove();
  }
}

function mutedText() {
  const s = Math.ceil((mutedUntil - Date.now()) / 1000);
  if (s <= 0) return t('zeroSeconds');
  if (s === 60) return t('minute');

const isSuper = () => !!me && me.u === 'admin11';
const isAdm = () => !!me && (me.u === 'admin11' || badges[me.u] === 'admin');

const fdate = x => new Date(x).toLocaleString(loc(), { hour12: h12() });

function checkBan() {
  if (!me) return;
  const b = banOf(me.u);
  if (!b) {
    if (banEl) { banEl.remove(); banEl = null; }
    if (bans[me.u]) db.ref('bans/' + me.u).remove().catch(() => {});
    return;
  }
  const k = b.at + ':' + b.until + ':' + lang();
  if (banEl && banEl.dataset.k === k) return;
  if (!banEl) {
    banEl = document.createElement('div');
    banEl.className = 'ov';
    banEl.style.cssText = 'z-index:99990;background:var(--bg);backdrop-filter:none';
    document.body.appendChild(banEl);
  }
  banEl.dataset.k = k;
  banEl.innerHTML = '<div class="md" style="text-align:center"><h3>' + E(t('youBanned')) + '</h3><p>' + E(t('reasonIs')) + ': ' + E(b.reason || '') + '</p><p>' + E(b.until ? t('until') + ' ' + fdate(b.until) : t('permanent')) + '</p>' + (b.byName ? '<p>' + E(t('byName')) + ': ' + esc(b.byName) + '</p>' : '') + '<button class="b g" id="bo">' + E(t('signOut')) + '</button></div>';
  banEl.querySelector('#bo').onclick = () => $('exitb').click();
}

function watchG(p) {
  const g = gid_(p);
  if (grpKnown.has(g)) return;
  grpKnown.add(g);
  on(db.ref('groups/' + g), s => {
    const v = s.val();
    if (!v) {
      if (GR[g]) {
        delete GR[g];
        idx.delete(p);
        db.ref('userChats/' + me.u + '/' + p).remove();
        if (chat === p) open(globalDisabled ? me.u : 'global');
      }
      side();
      return;
    }
    GR[g] = v;
    names.set(p, v.title);
    if (v.avatar && IMG.test(v.avatar)) AV[p] = v.avatar; else delete AV[p];
    side(); hdr(); comp();
  });
  on(db.ref('members/' + g), s => {
    const had = MB[g] && MB[g][me.u];

async function newGroup(type) {
  const myGroups = Object.keys(GR).filter(g => GR[g].owner === me.u);
  const limit = (badges[me.u] === 'checked' || badges[me.u] === 'admin' || me.u === 'admin11') ? 5 : 1;

  const o = modal(
    '<h3>' + E(type === 'group' ? t('createGroup') : t('createChannel')) + '</h3>' +
    '<input class="fld" id="gti" maxlength="30" placeholder="' + E(t('enterTitle')) + '">' +
    '<input class="fld" id="gn" maxlength="16" placeholder="a-z, 0-9, _ - !">' +
    '<div class="hint" id="gh">@name_' + esc(me.u) + '</div>' +

    b.disabled = true;

      const un = nn + '_' + me.u;
      const g = db.ref('groups').push().key;

      if (!r.committed) { b.disabled = false; return toast(t('nameTaken')); }

  if (q !== pq) pubFind(q);
  const rows = pubRes.filter(x => !idx.has('g:' + x.g));
  if (rows.length) $('list').insertAdjacentHTML('beforeend', '<div class="sec">' + (lang() === 'ru' ? 'Публичные группы' : 'Public groups') + '</div>' + rows.map(x => '<div class="nav" data-pg="' + esc(x.g) + '"><div class="av">#</div><span><b style="display:block">' + E(x.G.title) + '</b><small class="hint">' + E(TN[x.G.type]) + ' · @' + esc(x.un) + '</small></span></div>').join(''));
};
$('q').oninput = side;
$('list').addEventListener('click', async e => {
  const n = e.target.closest('[data-pg]');
  if (!n) return;
  const g = n.dataset.pg;
  try {
    if (!(await db.ref('members/' + g + '/' + me.u).once('value')).exists()) {
      const mem = (await db.ref('members/' + g).once('value')).val() || {};
      const limit = groupLimit(g);
      if (Object.keys(mem).length >= limit) return toast(t('groupFull').replace('{n}', limit));
      await db.ref('members/' + g + '/' + me.u).set('member');
      await logEv(g, 'join');
    }
    await db.ref('userChats/' + me.u + '/g:' + g).set(true);
    $('q').value = '';
    watchG('g:' + g);
    open('g:' + g, true);
  } catch (x) { toast(t('failedToJoin')); }
});

try {
  const a = JSON.parse(sessionStorage.getItem('mg_auto') || 'null');
  if (a) { sessionStorage.removeItem('mg_auto'); start(a.dn, a.u, null, 1); }
  else { hideLoader(); }
} catch (e) { console.error(e); hideLoader(); }
</script>
</body>
</html>
